<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dindin do Lukas Levy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8ED;
    --ink:#231C15;
    --morango:#FF4D6D;
    --manga:#FFC23C;
    --uva:#8A3FFC;
    --coco:#2FAE73;
    --stick:#E7C696;
    --shadow: 6px 6px 0 rgba(35,28,21,0.9);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .display{
    font-family:'Baloo 2', sans-serif;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 20px 60px;
  }

  /* ===== HERO ===== */
  .hero{
    padding:28px 0 10px;
    text-align:center;
  }
  .eyebrow{
    display:inline-block;
    background:var(--ink);
    color:var(--cream);
    font-weight:800;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:44px;
    line-height:1.02;
    margin:0 0 8px;
    font-weight:800;
  }
  .hero h1 span{
    display:block;
    color:var(--morango);
    -webkit-text-stroke: 2px var(--ink);
    text-stroke: 2px var(--ink);
  }
  .hero p{
    font-size:17px;
    font-weight:600;
    max-width:320px;
    margin:0 auto 22px;
    opacity:.85;
  }

  /* Popsicle signature illustration */
  .pop-stage{
    display:flex;
    justify-content:center;
    margin:14px 0 6px;
  }
  #popsicle{ transition: filter .25s ease; }
  #pop-body{ transition: fill .35s ease; }
  #pop-body2{ transition: fill .35s ease; }

  .price-tag{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    background:var(--manga);
    border:3px solid var(--ink);
    box-shadow:var(--shadow);
    border-radius:16px;
    padding:8px 18px;
    margin-top:14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    transform:rotate(-3deg);
  }
  .price-tag .num{ font-size:30px; }
  .price-tag .unit{ font-size:14px; opacity:.75; }

  /* ===== SECTION SHELL ===== */
  section{ margin-top:38px; }
  .sec-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .sec-sub{
    font-size:14px;
    font-weight:600;
    opacity:.65;
    margin:0 0 16px;
  }

  /* ===== FLAVOR CARDS ===== */
  .flavors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .flavor{
    position:relative;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:14px 12px 12px;
    background:#fff;
    box-shadow:var(--shadow);
    cursor:pointer;
    user-select:none;
